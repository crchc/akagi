name: Build Artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12.13'
  PBS_RELEASE: '20260414'
  UV_VERSION: '0.11.8'

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    name: ${{ matrix.target }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Prefer ~/.cargo/bin over Homebrew rustup-init
        if: runner.os == 'macOS'
        shell: bash
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache bundled runtime
        uses: actions/cache@v4
        with:
          path: |
            runtime/python/${{ matrix.target }}
            runtime/uv/${{ matrix.target }}
          key: runtime-${{ matrix.target }}-py${{ env.PYTHON_VERSION }}-pbs${{ env.PBS_RELEASE }}-uv${{ env.UV_VERSION }}

      - name: Fetch python+uv
        shell: bash
        run: bash scripts/fetch-runtime.sh "${{ matrix.target }}"

      - name: Build
        shell: bash
        run: |
          npm ci --prefix frontend
          npm run --prefix frontend build
          cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package zip
        shell: bash
        run: bash scripts/package-zip.sh "${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
